<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>网站密码管理（仅本机）</title>
<style>body{font:16px system-ui;background:#f1f5f2;color:#23473d;margin:0;padding:24px}main{max-width:440px;margin:8vh auto;background:white;padding:28px;border-radius:18px}label{display:grid;gap:8px;margin:20px 0}input,button{font:inherit;padding:12px;border:1px solid #d8e0dc;border-radius:8px}button{background:#315f54;color:white;cursor:pointer}p{line-height:1.6}small{color:#687b74}#message{white-space:pre-wrap}</style>
<main><h1>全站密码配置</h1><p>仅你电脑上的管理员工具。访客网站不提供密码设置功能。</p>
<form><label>当前访问密码<input name="currentPassword" type="password" autocomplete="current-password" maxlength="128" required></label><label>新访问密码<input name="password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required></label><label>再次输入新密码<input name="confirm" type="password" autocomplete="new-password" minlength="6" maxlength="128" required></label><button>保存并发布到网站</button></form><p id="message" role="status"></p><small>发布使用本机现有 GitHub 授权，只提交密码校验配置，不上传明文密码。部署完成后生效。静态密码锁可被绕过，不保护数据接口。</small></main>
<script>document.querySelector('form').addEventListener('submit',async e=>{e.preventDefault();const form=e.currentTarget;const button=form.querySelector('button');const message=document.querySelector('#message');button.disabled=true;message.textContent='正在保存并发布，请勿关闭…';try{const response=await fetch('/publish',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const result=await response.json();message.textContent=result.error||result.message;if(response.ok)form.reset();}catch{message.textContent='连接中断，请检查本机配置工具是否仍在运行，并核对 Git 发布状态。';}finally{button.disabled=false;}});</script></html>
